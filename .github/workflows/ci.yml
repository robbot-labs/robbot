name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages & DSH contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ROBBOT_PRIVATE_REPOS_PAT }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack (used by dsh scripts)
        run: corepack enable

      - name: Rewrite git SSH URLs to HTTPS
        # @electron/rebuild -> @electron/node-gyp is pinned to a git commit
        # (git@github.com:electron/node-gyp.git) with no registry equivalent;
        # GitHub runners have no SSH key, so fetch it over HTTPS instead.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @robbot/core build
          pnpm --filter @robbot/dsh-adapter build
          pnpm --filter @robbot/skill-coding build

      - name: Build DSH runtime (submodule)
        run: pnpm dsh:setup

      - name: Run DSH contract tests
        run: pnpm test:dsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  renderer:
    name: Renderer build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop/renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/renderer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build
