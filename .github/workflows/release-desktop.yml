name: Release desktop app

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Forge's GitHub publisher reuses the same draft release for each OS.
      # Serializing the matrix avoids two jobs creating/uploading it at once.
      max-parallel: 1
      matrix:
        include:
          # TODO: macOS 暂时停用，恢复时取消下面三行注释。
          # - name: macOS
          #   os: macos-latest
          - name: Windows
            os: windows-2022

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.ROBBOT_PRIVATE_REPOS_PAT }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Rewrite git SSH URLs to HTTPS
        run: 'git config --global url.https://github.com/.insteadOf git@github.com:'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install renderer dependencies
        run: npm ci --prefix apps/desktop/renderer

      - name: Build DSH runtime
        if: matrix.os == 'windows-2022'
        run: pnpm run dsh:setup

      - name: Prepare app node_modules for Forge
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function packagePathParts(packageName) {
            return packageName.split('/');
          }

          function packageDirExists(packageDir) {
            return fs.existsSync(path.join(packageDir, 'package.json'));
          }

          function findPnpmPackageDir(packageName, rootDir) {
            const virtualStore = path.join(rootDir, 'node_modules', '.pnpm');

            if (!fs.existsSync(virtualStore)) {
              return undefined;
            }

            const packageSuffix = path.join('node_modules', ...packagePathParts(packageName));

            for (const entry of fs.readdirSync(virtualStore)) {
              const packageDir = path.join(virtualStore, entry, packageSuffix);

              if (packageDirExists(packageDir)) {
                return packageDir;
              }
            }

            return undefined;
          }

          function resolvePackageDir(packageName, searchPaths) {
            for (const searchPath of searchPaths) {
              const directPackageDir = path.join(searchPath, 'node_modules', ...packagePathParts(packageName));

              if (packageDirExists(directPackageDir)) {
                return directPackageDir;
              }

              const pnpmPackageDir = findPnpmPackageDir(packageName, searchPath);

              if (pnpmPackageDir) {
                return pnpmPackageDir;
              }
            }

            let current = path.dirname(require.resolve(packageName, { paths: searchPaths }));

            while (current !== path.dirname(current)) {
              if (fs.existsSync(path.join(current, 'package.json'))) {
                return current;
              }
              current = path.dirname(current);
            }

            throw new Error(`Could not locate package root for ${packageName}`);
          }

          const appDir = path.resolve('apps/desktop');
          const appNodeModules = path.join(appDir, 'node_modules');
          const links = new Map([
            ['@robbot/core', path.resolve('packages/core')],
            ['@robbot/dsh-adapter', path.resolve('packages/dsh-adapter')],
            ...[
              'better-sqlite3',
              'drizzle-orm',
              'electron-squirrel-startup',
              'node-addon-api',
            ].map((packageName) => [
              packageName,
              resolvePackageDir(packageName, [appDir, process.cwd()]),
            ]),
          ]);

          fs.mkdirSync(appNodeModules, { recursive: true });

          for (const [packageName, target] of links) {
            const linkPath = path.join(appNodeModules, ...packageName.split('/'));

            fs.mkdirSync(path.dirname(linkPath), { recursive: true });

            if (fs.existsSync(linkPath)) {
              continue;
            }

            fs.symlinkSync(target, linkPath, process.platform === 'win32' ? 'junction' : 'dir');
            console.log(`${packageName} -> ${target}`);
          }
          NODE

      - name: Verify Electron dependency
        working-directory: apps/desktop
        run: >-
          node -e "console.log(require.resolve('electron/package.json', { paths: [process.cwd()] }))"

      - name: Verify native package dependencies
        working-directory: apps/desktop
        run: >-
          node -e "for (const pkg of ['better-sqlite3/package.json', 'node-addon-api/package.json']) console.log(require.resolve(pkg, { paths: [process.cwd()] }))"

      - name: Publish draft GitHub Release (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm --filter @robbot/desktop run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows NSIS installer
        if: matrix.os == 'windows-2022'
        run: |
          # Squirrel release flow, temporarily kept for rollback:
          # pnpm --filter @robbot/desktop run publish:win
          pnpm --filter @robbot/desktop run make:win:nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: Robbot-windows-x64
          if-no-files-found: error
          # Squirrel output, temporarily kept for rollback:
          # path: apps/desktop/out/make/**/*.exe
          path: apps/desktop/out/nsis/**/*.exe
